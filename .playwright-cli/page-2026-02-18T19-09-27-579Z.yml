      - generic [ref=e36]:
        - button "What is HydraWay?" [ref=e37]:
          - generic [ref=e38]: What is HydraWay?
          - img [ref=e40]
        - paragraph [ref=e44]: HydraWay is a premium electrolyte drink in soluble stick format. Each stick contains a balanced mix of sodium, potassium, magnesium, and vitamins for optimal hydration.
      - generic [ref=e45]:
        - button "How many sticks can I take per day?" [ref=e46]:
          - generic [ref=e47]: How many sticks can I take per day?
          - img [ref=e49]
        - paragraph [ref=e51]: We recommend 1 to 2 sticks per day. Dissolve one stick in 250 to 500 ml of water according to your taste preferences. Adjust your intake based on your activity level and weather conditions.
      - generic [ref=e52]:
        - button "Does HydraWay contain sugar?" [ref=e53]:
          - generic [ref=e54]: Does HydraWay contain sugar?
          - img [ref=e56]
        - paragraph [ref=e58]: No, HydraWay is sugar-free. Our formula is designed to provide effective hydration without the extra calories from sugar.
      - generic [ref=e59]:
        - button "Is HydraWay suitable for vegans?" [ref=e60]:
          - generic [ref=e61]: Is HydraWay suitable for vegans?
          - img [ref=e63]
        - paragraph [ref=e65]: Yes, HydraWay is gluten-free and suitable for vegan diets. No animal-derived ingredients are used in our formulation.
      - generic [ref=e66]:
        - button "When should I use HydraWay?" [ref=e67]:
          - generic [ref=e68]: When should I use HydraWay?
          - img [ref=e70]
        - paragraph [ref=e72]: HydraWay is ideal for intense sport, hot weather days, recovery after a night out, or simply to maintain proper hydric balance in your daily life.
      - generic [ref=e73]:
        - button "Where is HydraWay manufactured?" [ref=e74]:
          - generic [ref=e75]: Where is HydraWay manufactured?
          - img [ref=e77]
        - paragraph [ref=e79]: HydraWay is manufactured in Tunisia in a production facility certified GMP (21 CFR Part 111) and FSSC 22000, ensuring the highest quality and food safety standards.
      - generic [ref=e80]:
        - button "What are the delivery times?" [ref=e81]:
          - generic [ref=e82]: What are the delivery times?
          - img [ref=e84]
        - paragraph [ref=e86]: We deliver throughout Tunisia (all 24 governorates). Delivery times are generally 2 to 5 business days depending on your location.
      - generic [ref=e87]:
        - button "What payment methods do you accept?" [ref=e88]:
          - generic [ref=e89]: What payment methods do you accept?
          - img [ref=e91]
        - paragraph [ref=e93]: We accept online payment via Flouci as well as Cash on Delivery (COD) for your convenience.
      - generic [ref=e94]:
        - button "Is HydraWay a medication?" [ref=e95]:
          - generic [ref=e96]: Is HydraWay a medication?
          - img [ref=e98]
        - paragraph [ref=e100]: No, HydraWay is a dietary supplement. It is not a medication and does not replace medical treatment. If in doubt, consult your doctor.
